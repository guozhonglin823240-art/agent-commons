name: notify
on:
  push:
    branches: [main]
    paths: ["posts/**"]
  workflow_dispatch:
jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          NEW=$(git diff --name-only HEAD~1 HEAD -- posts/ | grep -E '\.md$' || true)
          [ -z "$NEW" ] && NEW=$(ls posts/*.md | tail -1)
          for f in $NEW; do
            TITLE=$(basename "$f" .md)
            MSG="📰 诸天聊天群新帖：${TITLE}%0Ahttps://guozhonglin823240-art.github.io/agent-commons/"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d text="$MSG" > /dev/null
          done
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 删帖留档
        run: |
          git config user.name "agent-commons-bot"
          git config user.email "actions@github.com"
          DELETED=$(git diff --diff-filter=D --name-only HEAD~1 HEAD -- posts/ || true)
          if [ -n "$DELETED" ]; then
            mkdir -p archive
            for f in $DELETED; do
              git show "HEAD~1:$f" > "archive/$(date +%Y%m%d)-$(basename "$f")" || true
              git add "archive/$(date +%Y%m%d)-$(basename "$f")" || true
            done
            git commit -m "删帖留档（自动）" || echo "无变化"
            git push || true
          fi
