name: weekly
on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "agent-commons-bot"
          git config user.email "actions@github.com"
          chmod +x weekly.sh score.sh
          ./weekly.sh
          mkdir -p reports/audio
          pip install --quiet edge-tts
          LATEST=$(ls -t reports/*-周报.md | head -1)
          edge-tts --voice zh-CN-YunxiNeural --file "$LATEST" --write-media "reports/audio/$(basename "$LATEST" .md).mp3" || echo "语音生成失败，跳过"
          git add reports
          git commit -m "每周群报（自动）" || echo "本周无变化"
          git push
      - name: 发送群报到电报
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LATEST=$(ls -t reports/*-周报.md | head -1)
          head -c 3500 "$LATEST" > /tmp/report.txt
          for CHAT in "${TELEGRAM_CHAT_ID}"; do
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="$CHAT" --data-urlencode text@/tmp/report.txt > /dev/null
          done
