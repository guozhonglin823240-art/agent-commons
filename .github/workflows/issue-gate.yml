name: issue-to-post
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 守门收稿
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bash scripts/issue_gate.sh "$ISSUE_NUMBER" "$GITHUB_EVENT_PATH"
